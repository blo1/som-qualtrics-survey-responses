service: som-qualtrics-survey-responses
variablesResolutionMode: 20210326
provider:
  name: aws
  runtime: nodejs18.x
  stage: dev
  region: us-west-2
  memorySize: 256
  lambdaHashingVersion: 20201221

  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - secretsmanager:GetSecretValue
      # Resource: "arn:aws:secretsmanager:us-west-2:324125712306:secret:som/qualtrics/api_key-iVmbWI"
      Resource: "arn:aws:secretsmanager:us-west-2:623187787127:secret:test/som/qualtrics/api_key-wfXZlz"

    - Effect: "Allow"
      Action:
        - s3:PutObject
        - s3:PutObjectAcl
      Resource:
        Fn::Join:
          - ""
          - - "arn:aws:s3:::"
            - "Ref" : SOMQualtricsSurveyResponseBucket
            - "/*"
  environment:
    BUCKET: ${self:custom.outputBucket}
    QUALTRICS_API_TOKEN: ${self:custom.qualtricsApiToken.SOM_QUALTRICS_API_TOKEN}
    QUALTRICS_DATA_CENTER: "ucsf.co1"

custom:
  outputBucket: 'test-som-qualtrics-survey-responses-${opt:stage, self:provider.stage}'
  qualtricsApiToken: ${ssm:/aws/reference/secretsmanager/test/som/qualtrics/api_key}
  isScheduleEnabled:
    prod: true
    dev: false

functions:
  storeSurveys:
    timeout: 600
    handler: handler.storeSurveys
    events:
      - schedule:
          rate: rate(30 minutes)
          enabled: ${self:custom.isScheduleEnabled.${self:provider.stage}}
    environment:
      SURVEY_IDS: > 
        SV_exInb81a5EtSLDT,
        SV_0f94AVpaDvMS9p4








# you can add CloudFormation resource templates here
resources:
 Resources:
   SOMQualtricsSurveyResponseBucket:
     Type: AWS::S3::Bucket
     Properties:
       BucketName: ${self:custom.outputBucket}
       PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
       BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
